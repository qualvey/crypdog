version: '3.8'

services:
  crypdog:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVICE_SECRET_KEY=crypdog-secret-key-123456
      - SHARED_WEBHOOK_SECRET=crypdog-webhook-secret-987654
      - DB_DRIVER=postgres
      - DB_DSN=host=postgres user=postgres password=postgres dbname=crypdog port=5432 sslmode=disable
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypdog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
