env: "development" # "development" 或 "production" (生产环境将强制启用密钥防弱口令及安全防御校验)

server:
  port: "8080"
  secret: "crypdog-secret-key-123456"
  admin_secret: "crypdog-admin-secret-123456"
  allowed_origins: [] # 例如 ["https://admin.example.com"]
  rate_limit_per_minute: 300
  enable_simulation: false # 模拟入账测试接口总开关，生产环境必须且强制为 false

webhook:
  webhook_secret: "crypdog-webhook-secret-987654"
  max_retries: 3
  timeout_sec: 5
  allow_local: true # 本地开发/联调设为 true，允许 localhost/127.0.0.1 闭环回调；生产环境设为 false 防 SSRF

database:
  driver: "sqlite" # "sqlite" 或 "postgres"
  dsn: "crypdog.db"

log:
  level: "info"       # "debug" | "info" | "warn" | "error"
  format: "json"      # "text" 或 "json"；生产环境推荐 json
  output: "stdout"    # "stdout" 或 "file"
  file_path: ""       # 日志落盘路径
  timestamp: true      # 文本日志是否输出时间戳
  max_size_mb: 100     # 单个日志文件最大大小，超过后轮转
  max_backups: 7       # 保留的历史日志文件数量

metrics:
  enabled: true
  path: "/metrics"
  secret: "" # 生产环境必须配置独立指标密钥

pprof:
  enabled: false

# 针对各区块链节点的通信配置
chains:
  TRON:
    enabled: false
    driver: "tron"
    rpc_url: "https://api.trongrid.io"
    api_key: ""
    confirmations: 19
  BSC:
    enabled: false
    driver: "evm"
    rpc_url: "https://binance.llamarpc.com"
    confirmations: 15
  ARBITRUM:
    enabled: true
    driver: "evm"
    rpc_url: "https://arb1.arbitrum.io/rpc"
    batch_size: 500
    block_delay: 20
    confirmations: 10
  POLYGON:
    enabled: false
    driver: "evm"
    rpc_url: "https://polygon-rpc.com"
    confirmations: 128
  SOLANA:
    enabled: true
    driver: "solana"
    rpc_url: "https://api.mainnet-beta.solana.com"
    confirmations: 32

# 预设的收款钱包地址池（支持无限追加）
