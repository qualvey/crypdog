name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go vet ./...

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      # DEPLOY_PATH is a repository/environment variable, not an SSH secret.
      # Keeping it separate prevents a misconfigured secret from being passed
      # to scp-action as the remote directory.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/crypdog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            # The deploy user must be able to write the directory because
            # scp-action uploads and extracts the archive as that user.
            if [ -d "$DEPLOY_PATH" ] && [ ! -w "$DEPLOY_PATH" ]; then
              sudo -n install -d -o "$(id -un)" -g "$(id -gn)" "$DEPLOY_PATH"
            else
              mkdir -p "$DEPLOY_PATH"
            fi
            if [ -e "$DEPLOY_PATH/docker-compose.yml" ] && [ ! -w "$DEPLOY_PATH/docker-compose.yml" ]; then
              sudo -n chown "$(id -un):$(id -gn)" "$DEPLOY_PATH/docker-compose.yml"
            fi
            test -w "$DEPLOY_PATH"

      - name: Copy Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull and restart service
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            test -s .env
            chmod 600 .env
            grep -q '^CRYPDOG_SECRET=' .env
            grep -q '^CRYPDOG_ADMIN_SECRET=' .env
            grep -q '^CRYPDOG_WEBHOOK_SECRET=' .env
            grep -q '^CRYPDOG_METRICS_SECRET=' .env
            grep -q '^POSTGRES_PASSWORD=' .env
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            export CRYPDOG_IMAGE="$IMAGE"
            # Remove containers from this Compose project before recreating
            # them. This releases the published 8080 port from old revisions.
            docker compose down --remove-orphans
            docker compose pull crypdog
            docker compose up -d --no-build crypdog
            docker compose ps
            if ! curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8080/healthz/live; then
              echo '=== crypdog container status ==='
              docker compose ps -a
              echo '=== crypdog startup logs ==='
              docker compose logs --no-color --tail=200 crypdog
              exit 1
            fi
