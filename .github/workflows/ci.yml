name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        env:
          CRYPDOG_SECRET: ci-service-secret-123456789
          CRYPDOG_ADMIN_SECRET: ci-admin-secret-123456789
          CRYPDOG_WEBHOOK_SECRET: ci-webhook-secret-123456789
          CRYPDOG_METRICS_SECRET: ci-metrics-secret-123456789
          POSTGRES_PASSWORD: ci-postgres-password-123
        run: docker compose config >/dev/null

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crypdog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
